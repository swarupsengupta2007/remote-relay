name: Release

# Pushing a v* tag tests, builds and publishes that tag. Running it by hand
# with an existing tag rebuilds it and replaces the release's assets, e.g. to
# add a platform to a release that already exists.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (e.g. v0.1.0)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Tests (-race)
        run: go test -race -count=1 -timeout 15m ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ env.TAG }}
        run: |
          name="relay_${VERSION}_${GOOS}_${GOARCH}"
          ext=""
          if [ "$GOOS" = windows ]; then ext=".exe"; fi
          mkdir -p "dist/$name"
          go build -trimpath \
            -ldflags "-s -w -X github.com/remote-relay/relay/internal/version.Version=${VERSION}" \
            -o "dist/$name/relay$ext" ./cmd/relay
          cp LICENSE README.md "dist/$name/"
          # Reproducible archives: pin every timestamp to the tagged commit
          # so rebuilding a tag yields the same checksums.
          epoch=$(git log -1 --format=%ct)
          cd dist
          find "$name" -exec touch -h -d "@$epoch" {} +
          if [ "$GOOS" = windows ]; then
            find "$name" | LC_ALL=C sort | zip -qX "$name.zip" -@
          else
            tar --sort=name --mtime="@$epoch" --owner=0 --group=0 --numeric-owner \
              -cf - "$name" | gzip -n > "$name.tar.gz"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: relay-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          else
            prerelease=""
            if [[ "$TAG" == *-* ]]; then prerelease="--prerelease"; fi
            gh release create "$TAG" dist/* \
              --repo "$REPO" \
              --verify-tag \
              --title "$TAG" \
              --generate-notes \
              $prerelease
          fi
