name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  check:
    name: Lint, Test & Cross-Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not formatted properly:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Install and Run staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          staticcheck ./...

      - name: Run Tests (-race)
        run: go test -race -count=1 -timeout 10m -v ./...

      - name: Cross-Build (linux/amd64)
        run: GOOS=linux GOARCH=amd64 go build -v ./cmd/relay

      - name: Cross-Build (linux/arm64)
        run: GOOS=linux GOARCH=arm64 go build -v ./cmd/relay

      - name: Cross-Build (darwin/amd64)
        run: GOOS=darwin GOARCH=amd64 go build -v ./cmd/relay

      - name: Cross-Build (darwin/arm64)
        run: GOOS=darwin GOARCH=arm64 go build -v ./cmd/relay

      - name: Cross-Build (windows/amd64)
        run: GOOS=windows GOARCH=amd64 go build -v ./cmd/relay

      - name: Cross-Build (windows/arm64)
        run: GOOS=windows GOARCH=arm64 go build -v ./cmd/relay
